<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} - Sông Hương</title>

    {% block styles %}
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.6; }
        nav { background-color: #f3ede2; padding: 12px 18px; margin-bottom: 24px; border-radius: 6px; }
        nav a { margin-right: 18px; text-decoration: none; color: #5d4037; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 14px; color: #666; font-size: 0.9em; }
    </style>
    {% endblock %}
</head>
<body>
    <!-- Nhúng menu từ _navbar.html -->
    {% include "_navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Nhúng chân trang từ _footer.html -->
    {% include "_footer.html" %}
</body>
</html>
