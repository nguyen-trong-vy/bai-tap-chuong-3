<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chương 5{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #0d6efd;
        }
        .custom-navbar .navbar-brand {
            color: #fff;
            font-weight: bold;
            font-size: 1.35rem;
        }
        .custom-navbar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }
        .custom-navbar .nav-link:hover, .custom-navbar .nav-link.active {
            color: #fff;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Chương 5: Form & Data</a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
    </nav>

    <!-- Khối nội dung thay đổi của từng trang -->
    <main class="container my-auto py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 text-muted small border-top bg-white mt-auto">
        Khoa Công nghệ Thông tin - Trường Đại học Khoa học, Đại học Huế
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
